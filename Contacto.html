<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <title>NexCode |  Reservas</title>
</head>

<body>
    <nav class="navbar navbar-dark navbar-expand-lg barra-barber">
        <div class="container-fluid px-0">
            <a class="navbar-brand logo" href="#">NexCodeBarber</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir navegacion">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <div class="navbar-nav menu me-auto">
                    <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">
                        inicio
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="index.html">inicio</a></li>
                    </ul>
                </div>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                <div class="navbar-nav menu me-auto">
                    <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">
                        Servicios
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="servcicios.html">Servicios</a></li>
                    </ul>
                </div>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                <div class="navbar-nav menu me-auto">
                    <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">
                        Barberos
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="Barberos.html">Barberos</a></li>
                    </ul>
                </div>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                <div class="navbar-nav menu me-auto">
                    <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">
                        Reservas
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="Reservas.html">Reservas</a></li>
                    </ul>
                </div>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                <div class="navbar-nav menu me-auto">
                    <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">
                        Contacto
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="Contacto.html">Contacto</a></li>
                    </ul>
                </div>

                <form class="d-flex buscador my-3 my-lg-0" role="search">
                    <div class="input-group">
                        <input class="form-control" type="search" placeholder="Search" aria-label="Buscar">
                        <button class="btn btn-search" type="submit">Search</button>
                    </div>
                </form>


                <div class="usuarios ms-lg-3 mt-2 mt-lg-0 d-flex gap-2">


                    <div class="dropdown">
                        <button class="btn btn-outline-light dropdown-toggle" type="button" id="dropdownSignup"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            Sign-up
                        </button>
                        <form class="dropdown-menu dropdown-menu-end p-4 shadow" style="width: 280px;"
                            aria-labelledby="dropdownSignup">
                            <h5 class="mb-3">Registro</h5>
                            <div class="mb-3">
                                <label for="signupEmail" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="signupEmail" placeholder="tu@email.com">
                            </div>
                            <div class="mb-3">
                                <label for="signupPassword" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="signupPassword"
                                    placeholder="Contraseña">
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Registrarse</button>
                        </form>
                    </div>


                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle" type="button" id="dropdownLogin"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            Login
                        </button>
                        <form class="dropdown-menu dropdown-menu-end p-4 shadow" style="width: 280px;"
                            aria-labelledby="dropdownLogin">
                            <h5 class="mb-3">Iniciar Sesión</h5>
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="loginEmail" placeholder="tu@email.com">
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="loginPassword" placeholder="Contraseña">
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Entrar</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
</body>

</html>
